[General]
auto-profiles = no

# ALSA's surround21 device loses the LFE channel on the X4, so open the
# hardware directly in its own 6-channel order; only FL, FR and LFE are used.
[Mapping analog-surround-21]
device-strings = hw:%f
channel-map = front-left,front-right,front-center,lfe,rear-left,rear-right
paths-output = analog-output analog-output-lineout analog-output-speaker
direction = output
priority = 13

[Profile sound-blaster-x4-21]
output-mappings = analog-surround-21
