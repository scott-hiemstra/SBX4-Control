# Publishes the APT repository (scott-hiemstra.github.io/SBX4-Control) to
# GitHub Pages: every released .deb, signed with the APT_SIGNING_KEY secret,
# plus AppStream data so the app shows up in GNOME Software and Discover.
# Runs after each successful release, or by hand from the Actions tab.
name: APT repository

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q apt-utils appstream
      - name: Download every released .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir debs
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs || true
          done
          ls -l debs
      - name: Build and sign the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::The APT_SIGNING_KEY secret isn't set; see 'APT repository' in the README."
            exit 1
          fi
          export GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          packaging/apt/build-repo.sh debs site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
